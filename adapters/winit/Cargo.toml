[package]
name = "accesskit_winit"
version = "0.34.0"
authors.workspace = true
license = "Apache-2.0"
description = "AccessKit UI accessibility infrastructure: winit adapter"
categories.workspace = true
keywords = ["gui", "ui", "accessibility", "winit"]
repository.workspace = true
readme = "README.md"
edition.workspace = true
rust-version = "1.88"

[features]
default = ["accesskit_unix", "async-io", "rwh_06", "winit/x11", "winit/wayland"]
rwh_06 = ["dep:rwh_06"]
async-io = ["accesskit_unix/async-io"]
tokio = ["accesskit_unix/tokio"]

[dependencies]
accesskit = { version = "0.25.0", path = "../../accesskit" }
winit = { version = "=0.31.0-beta.3", default-features = false }
rwh_06 = { package = "raw-window-handle", version = "0.6.2", features = ["std"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = { version = "0.35.0", path = "../windows" }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { version = "0.27.0", path = "../macos" }

[target.'cfg(any(all(target_os = "linux", not(target_env = "ohos")), target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
accesskit_unix = { version = "0.23.0", path = "../unix", optional = true, default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
accesskit_android = { version = "0.8.0", path = "../android", optional = true, features = ["embedded-dex"] }

[target.'cfg(target_os = "ios")'.dependencies]
accesskit_ios = { version = "0.2.0", path = "../ios" }

[dev-dependencies.winit]
version = "=0.31.0-beta.3"
default-features = false
features = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dev-dependencies.softbuffer]
version = "0.4.8"
default-features = false
features = [
    "x11",
    "x11-dlopen",
    "wayland",
    "wayland-dlopen",
]

[target.'cfg(target_os = "ios")'.dev-dependencies.softbuffer]
version = "0.4.8"
default-features = false

[target.'cfg(target_env = "ohos")'.dependencies]
accesskit_ohos = { version = "0.1.0", path = "../ohos", features = ["api-15"] }
ohos-accessibility-binding = { version = "0.1.2", git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "216d45870a0c0690b56280b39f0b82484b1c913b", features = ["api-15"] }
log = "0.4"
